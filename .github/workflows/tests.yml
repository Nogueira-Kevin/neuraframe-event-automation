name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["8.2", "8.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Syntaxe PHP
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Tests
        run: php tests/AutomationScheduleTest.php
